<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Heart</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
        }
        #wrapper {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        #heart-container {
            position: relative;
            width: 800px; height: 800px; 
            transform: scale(var(--scale, 1)); 
            transform-origin: center center;
            margin-left: -120px; 
            margin-top: -100px; 
        }
        .word {
            position: absolute;
            color: #e8b4b8; 
            font-size: 14px; 
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease-out; 
            transform: translate(-50%, -50%); 
        }
        .word.show { opacity: 1; }

        /* Центральный текст */
        #center-text {
            position: absolute;
            left: 400px; 
            top: 400px;
            transform: translate(-50%, -50%) scale(0);
            color: #ff4d6d; 
            font-size: 32px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: bold;
            opacity: 0;
            white-space: nowrap; /* Запрещаем перенос строк */
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.8);
            z-index: 10;
        }
        #center-text.show-center {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="heart-container">
            <div id="center-text">I love you</div>
        </div>
    </div>
    <script>
        const container = document.getElementById('heart-container');
        const wrapper = document.getElementById('wrapper');
        const centerText = document.getElementById('center-text');
        
        const text = "I love you";
        const totalWords = 200; 
        let currentIndex = 0;

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            const scale = 20; 
            return {
                x: 400 + x * scale,
                y: 400 + y * scale
            };
        }

        function animate() {
            if (currentIndex >= totalWords) {
                setTimeout(() => {
                    centerText.classList.add('show-center');
                }, 500);
                return;
            }

            const t = (currentIndex / totalWords) * Math.PI * 2;
            const pos = getHeartPoint(t);

            const span = document.createElement('span');
            span.className = 'word';
            span.innerText = text;
            
            span.style.left = pos.x + 'px';
            span.style.top = pos.y + 'px';

            container.appendChild(span);

            setTimeout(() => {
                span.classList.add('show');
            }, 10);

            currentIndex++;
            setTimeout(animate, 12); 
        }

        function resize() {
            const scaleX = wrapper.clientWidth / 800;
            const scaleY = wrapper.clientHeight / 800;
            const scale = Math.min(scaleX, scaleY) * 0.9; 
            container.style.setProperty('--scale', scale);
        }

        window.addEventListener('resize', resize);
        window.onload = () => {
            resize();
            setTimeout(animate, 300);
        };
    </script>
</body>
</html>
